name: Build and Push Custom Kinoite Image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily rebuild, optional
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - ".github/workflows/build.yml"

env:
  IMAGE_NAME: febdora
  IMAGE_REGISTRY: ghcr.io/febley
  FEDORA_VERSION: "44"
  USER_NAME: febley

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set date tag for scheduled runs
        id: date
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DATE_TAG=$(date -u +%Y%m%d)
            echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v8

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            latest
            ${{ env.FEDORA_VERSION }}
            ${{ steps.date.outputs.date_tag && format('{0}-{1}', env.FEDORA_VERSION, steps.date.outputs.date_tag) || '' }}
          containerfiles: |
            ./Containerfile
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in latest ${FEDORA_VERSION}; do
            digest=$(skopeo inspect docker://${IMAGE_FULL}:${tag} | jq -r '.Digest')
            cosign sign -y --key env://SIGNING_SECRET "${IMAGE_FULL}@${digest}"
          done
          # Sign date-tagged image if it exists (daily builds)
          if [ -n "${{ steps.date.outputs.date_tag }}" ]; then
            DATE_TAG="${{ steps.date.outputs.date_tag }}"
            digest=$(skopeo inspect docker://${IMAGE_FULL}:${{ env.FEDORA_VERSION }}-${DATE_TAG} | jq -r '.Digest')
            cosign sign -y --key env://SIGNING_SECRET "${IMAGE_FULL}@${digest}"
          fi
